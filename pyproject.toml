[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shunt"
version = "2026080920"
description = "transparent remote hands for an AI coding agent — redirects bash to a chosen remote host via a Claude Code hook"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
authors = [
  { name = "Alex Hristow" },
]
keywords = ["claude", "ai", "ssh", "remote", "hook", "agent"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
]

[project.scripts]
shunt = "shunt.cli:main"

[project.urls]
Homepage = "https://github.com/Fever-Wits/shunt"
Repository = "https://github.com/Fever-Wits/shunt"

[tool.hatch.build.targets.wheel]
packages = ["src/shunt"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Spelled out rather than left to ruff's defaults: the defaults drift between
# releases, and CI installs the latest ruff. This is the default set as of
# ruff 0.15 — E4 (imports), E7 (statements), E9 (syntax/IO), F (pyflakes).
# E1/E2/E3 (indentation, whitespace, blank lines) and E5 (line length) are
# deliberately out: `ruff format` is the style authority here, and those are
# the categories that argue with it.
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701", "E702", "E703", "E741"]
